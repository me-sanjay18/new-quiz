<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quiz — Quiz Master</title>
  <link rel="stylesheet" href="quiz.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1 id="quiz-title">Quiz Master</h1>
      <p id="progress">Question <span id="current">0</span> / <span id="total">0</span></p>
    </header>

    <section id="question-card" class="card" aria-live="polite">
      <h2 id="question-text">Loading question...</h2>

      <div id="answers" class="answers" role="list"></div>

      <div class="controls">
        <button id="next-btn" class="btn" disabled>Next</button>
      </div>
    </section>
  </main>

  <script src="quiz.js"></script>
  <script src="a.js"></script>
</body>
</html>
